name: Refresh contribution graph

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-contributions*'
      - '.github/workflows/update-contributions.yml'

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test renderer
        run: node --test scripts/update-contributions.test.mjs
      - name: Fetch public contribution data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-contributions.mjs
      - name: Commit refreshed graph when data changes
        run: |
          git add assets/contribution-graph.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution activity"
          git push
