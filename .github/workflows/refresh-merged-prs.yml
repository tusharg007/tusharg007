name: Refresh merged engineering contributions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-merged-prs*'
      - '.github/workflows/refresh-merged-prs.yml'
      - 'data/approved-private-prs.json'

permissions:
  contents: write

concurrency:
  group: merged-prs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test merged PR renderer
        run: node --test scripts/update-merged-prs.test.mjs
      - name: Refresh external and approved employer PR metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_PRS_TOKEN: ${{ secrets.MERGED_PRS_READ_TOKEN }}
        run: node scripts/update-merged-prs.mjs
      - name: Commit updated profile section
        run: |
          git add README.md assets/merged-prs.json data/approved-private-prs.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh merged engineering contributions"
          git pull --rebase origin main
          git push
