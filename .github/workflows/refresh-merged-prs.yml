name: Refresh public merged pull requests

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-merged-prs*'
      - '.github/workflows/refresh-merged-prs.yml'

permissions:
  contents: write

concurrency:
  group: merged-prs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test merged PR renderer
        run: node --test scripts/update-merged-prs.test.mjs
      - name: Refresh public PR list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-merged-prs.mjs
      - name: Commit updated profile section
        run: |
          git add README.md assets/merged-prs.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh merged public PRs"
          git push
